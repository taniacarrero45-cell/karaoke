<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Karaoke Party</title>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #video-container { flex: 3; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #chat-container { flex: 1; background: #222; border-left: 2px solid #444; padding: 10px; min-width: 300px; }
        iframe { border-radius: 10px; border: none; }
        h1 { font-size: 20px; color: #ff00ff; text-shadow: 2px 2px #000; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="video-container">
        <h1>🎤 KARAOKE LIVE 🎤</h1>
        <iframe width="100%" height="80%" src="https://www.youtube.com/embed/videoseries?list=PL4fGSI1pDJn6jWnvvv6vS_S_v00V6H9p1" allowfullscreen></iframe>
        <p>Scegli una canzone e inizia a cantare!</p>
    </div>

    <div id="chat-container">
        <p style="text-align:center">💬 Chat del Karaoke</p>
        
        <div style="color:gray; text-align:center; margin-top:50px;">[Qui apparirà la tua Chat]</div>
        
    </div>

</body>
</html>
